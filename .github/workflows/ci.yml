name: CI

# Typecheck, testes e checagens de banco em todo push na main e em PR.
# As duas últimas pegam problemas que já chegaram à main antes: migration
# faltando pra um campo do schema (Network.noShowFee*) e seed quebrado.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: barbershop
          POSTGRES_PASSWORD: barbershop
          POSTGRES_DB: barbershop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barbershop -d barbershop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://barbershop:barbershop@localhost:5432/barbershop?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # Sem --fix (o script "lint" do package.json corrige sozinho); falha só
      # em erro, avisos não travam
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build
        run: pnpm build

      # Antes dos testes: os de integração (*.int.spec.ts) usam o Postgres do
      # workflow já migrado
      - name: Migrations
        run: npx prisma migrate deploy

      - name: Testes
        run: pnpm test


      # Sai com código 2 se o schema.prisma tiver algo que as migrations não
      # criam (ex.: campo adicionado sem `prisma migrate dev`)
      - name: Schema e migrations em sincronia
        run: >-
          npx prisma migrate diff
          --from-schema-datasource prisma/schema.prisma
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Seed (modo produção)
        run: pnpm seed
        env:
          NODE_ENV: production

      - name: Seed (dados de demonstração)
        run: pnpm seed
        env:
          SEED_DEMO: 'true'

      # Sobe o app de verdade: teste unitário não pega pacote faltando no boot
      # nem erro de ligação entre módulos (ex.: o Apollo 5 exige
      # @as-integrations/express5 — sem ele os testes passavam e o app não
      # subia). Valores de exemplo do .env.example; banco e Redis são os do
      # workflow (variáveis do job têm prioridade sobre o .env).
      - name: App sobe e responde
        run: |
          cp .env.example .env
          node dist/src/main > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf localhost:3020/health > health.json && break
            sleep 1
          done
          cat health.json || { cat app.log; exit 1; }
          grep -q '"database":"connected"' health.json || { cat app.log; exit 1; }
          grep -q '"redis":"connected"' health.json || { cat app.log; exit 1; }
          curl -sf -X POST localhost:3020/graphql \
            -H 'content-type: application/json' \
            -d '{"query":"{ __typename }"}' | grep -q Query || { cat app.log; exit 1; }
