name: CI

# Typecheck, testes e checagens de banco em todo push na main e em PR.
# As duas últimas pegam problemas que já chegaram à main antes: migration
# faltando pra um campo do schema (Network.noShowFee*) e seed quebrado.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: barbershop
          POSTGRES_PASSWORD: barbershop
          POSTGRES_DB: barbershop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barbershop -d barbershop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://barbershop:barbershop@localhost:5432/barbershop?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Testes
        run: pnpm test

      - name: Migrations
        run: npx prisma migrate deploy

      # Sai com código 2 se o schema.prisma tiver algo que as migrations não
      # criam (ex.: campo adicionado sem `prisma migrate dev`)
      - name: Schema e migrations em sincronia
        run: >-
          npx prisma migrate diff
          --from-schema-datasource prisma/schema.prisma
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Seed (modo produção)
        run: pnpm seed
        env:
          NODE_ENV: production

      - name: Seed (dados de demonstração)
        run: pnpm seed
        env:
          SEED_DEMO: 'true'
